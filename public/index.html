<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NGL Sender — Anonymous Messages</title>
<meta name="description" content="Send anonymous messages to any NGL.link username instantly.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<style>
  *{-webkit-font-smoothing:antialiased}
  @keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
  @keyframes scaleIn{from{opacity:0;transform:scale(0.98)}to{opacity:1;transform:scale(1)}}
  .fade-up{animation:fadeUp 0.55s cubic-bezier(0.16,1,0.3,1) both}
  .card-shadow{box-shadow:0 1px 2px rgba(15,23,42,0.04),0 8px 24px rgba(15,23,42,0.06),0 20px 40px rgba(15,23,42,0.04)}
  .input-focus:focus{box-shadow:0 0 0 4px rgba(15,23,42,0.06);border-color:#0f172a}
  .btn-hover{transition:all 0.2s cubic-bezier(0.16,1,0.3,1)}
  .btn-hover:hover{transform:translateY(-1px);box-shadow:0 10px 24px rgba(15,23,42,0.18)}
  .btn-hover:active{transform:translateY(0)}
  .num-btn{transition:all 0.15s ease}
  .num-btn:hover{background:#f1f5f9}
  .num-btn:active{transform:scale(0.97)}
</style>
</head>
<body class="bg-[#f8fafc] text-[#0f172a] font-[Inter] min-h-screen flex flex-col">
  <div class="fixed inset-0 -z-10 pointer-events-none">
    <div class="absolute inset-0 bg-[#f8fafc]"></div>
    <div class="absolute inset-0 opacity-[0.025]" style="background-image:radial-gradient(#0f172a 1px, transparent 1px);background-size:24px 24px"></div>
    <div class="absolute top-0 left-1/2 -translate-x-1/2 w-[760px] h-[320px] bg-white rounded-full blur-[60px]"></div>
  </div>

  <header class="w-full max-w-[560px] mx-auto px-4 sm:px-6 pt-10 pb-6">
    <div class="flex items-center justify-center gap-3 fade-up">
      <div class="w-9 h-9 rounded-xl bg-[#0f172a] flex items-center justify-center">
        <span class="text-white font-extrabold text-[13px] tracking-tight">ngl</span>
      </div>
      <div class="text-[15px] font-bold tracking-tight">NGL Sender</div>
    </div>
  </header>

  <main class="flex-1 w-full max-w-[560px] mx-auto px-4 sm:px-6 pb-10">
    <div class="bg-white rounded-[24px] border border-[#e2e8f0] card-shadow overflow-hidden fade-up" style="animation-delay:0.08s">
      <div class="px-6 sm:px-8 pt-8 pb-2">
        <h1 class="text-[24px] font-extrabold tracking-[-0.03em] leading-tight">Send a message</h1>
        <p class="mt-1.5 text-[13px] leading-relaxed text-[#64748b]">Works with any <span class="font-medium text-[#334155]">ngl.link</span> profile. Fast, real delivery.</p>
      </div>

      <form id="mainForm" class="px-6 sm:px-8 pt-6 pb-7 space-y-5">
        <!-- Username -->
        <div class="space-y-2">
          <label class="text-[11px] font-bold tracking-widest text-[#334155] uppercase">NGL Username</label>
          <div class="relative">
            <div class="absolute left-3.5 top-1/2 -translate-y-1/2 pointer-events-none text-[13px] font-medium text-[#94a3b8]">ngl.link/</div>
            <input id="username" required autocomplete="off" placeholder="johndoe" class="w-full pl-[84px] pr-3 py-3.5 rounded-xl bg-white border border-[#e2e8f0] text-[14px] font-medium placeholder:text-[#cbd5e1] focus:outline-none input-focus transition">
          </div>
        </div>

        <!-- Message -->
        <div class="space-y-2">
          <label class="text-[11px] font-bold tracking-widest text-[#334155] uppercase flex justify-between">Message <span id="charCount" class="font-mono font-medium text-[#94a3b8] normal-case tracking-normal">0 / 300</span></label>
          <textarea id="message" required maxlength="300" rows="4" placeholder="Type your message here..." class="w-full px-3.5 py-3 rounded-xl bg-white border border-[#e2e8f0] text-[14px] leading-relaxed placeholder:text-[#cbd5e1] focus:outline-none input-focus transition resize-none"></textarea>
        </div>

        <!-- Amount -->
        <div class="space-y-2">
          <label class="text-[11px] font-bold tracking-widest text-[#334155] uppercase">Amount</label>
          <div class="flex items-center bg-white border border-[#e2e8f0] rounded-xl overflow-hidden focus-within:border-[#0f172a] focus-within:shadow-[0_0_0_4px_rgba(15,23,42,0.06)] transition">
            <button type="button" id="minusBtn" class="num-btn w-12 h-[46px] flex items-center justify-center border-r border-[#e2e8f0] text-[#475569] shrink-0">
              <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M3.5 7H10.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
            </button>
            <input id="amount" type="number" min="1" max="1000" value="10" class="flex-1 h-[46px] text-center text-[15px] font-bold bg-transparent border-0 focus:outline-none focus:ring-0">
            <button type="button" id="plusBtn" class="num-btn w-12 h-[46px] flex items-center justify-center border-l border-[#e2e8f0] text-[#475569] shrink-0">
              <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M7 3.5V10.5M3.5 7H10.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
            </button>
          </div>
          <div class="flex justify-between text-[11px] font-medium text-[#94a3b8]">
            <span>1</span><span>1000 max • ultra fast</span><span>1000</span>
          </div>
        </div>

        <button id="sendBtn" type="submit" class="btn-hover w-full h-[48px] rounded-xl bg-[#0f172a] text-white text-[13px] font-bold tracking-wide flex items-center justify-center gap-2">
          <span id="sendLabel">Send messages</span>
          <span id="sendSpinner" class="hidden w-4 h-4 border-2 border-white/20 border-t-white rounded-full animate-spin"></span>
        </button>

        <!-- Result only success -->
        <div id="resultCard" class="hidden rounded-2xl border overflow-hidden" style="border-color:#bbf7d0; animation: scaleIn 0.4s cubic-bezier(0.16,1,0.3,1)">
          <div id="resultContent" class="px-5 py-5 flex items-center gap-4 bg-white"></div>
        </div>

        <!-- Progress -->
        <div id="progressWrap" class="hidden space-y-2">
          <div class="flex justify-between text-[11px] font-medium text-[#64748b]"><span id="progressText">Sending…</span><span id="progressCount" class="font-mono text-[#0f172a]">0 / 0</span></div>
          <div class="h-1.5 bg-[#f1f5f9] rounded-full overflow-hidden border border-[#e2e8f0]/60"><div id="progressBar" class="h-full bg-[#0f172a] rounded-full transition-all duration-200" style="width:0%"></div></div>
        </div>
      </form>
    </div>

    <p class="mt-4 text-center text-[11px] font-medium text-[#94a3b8]">Only delivered messages are counted. Be respectful.</p>
  </main>

<script>
  const usernameEl=document.getElementById('username');
  const messageEl=document.getElementById('message');
  const amountEl=document.getElementById('amount');
  const charCount=document.getElementById('charCount');
  const minusBtn=document.getElementById('minusBtn');
  const plusBtn=document.getElementById('plusBtn');
  const form=document.getElementById('mainForm');
  const sendBtn=document.getElementById('sendBtn');
  const sendLabel=document.getElementById('sendLabel');
  const sendSpinner=document.getElementById('sendSpinner');
  const resultCard=document.getElementById('resultCard');
  const resultContent=document.getElementById('resultContent');
  const progressWrap=document.getElementById('progressWrap');
  const progressBar=document.getElementById('progressBar');
  const progressText=document.getElementById('progressText');
  const progressCount=document.getElementById('progressCount');

  messageEl.addEventListener('input',()=>{ charCount.textContent=messageEl.value.length+' / 300'; });
  minusBtn.addEventListener('click',()=>{ let v=parseInt(amountEl.value||'1',10); if(v>1) amountEl.value=v-1; });
  plusBtn.addEventListener('click',()=>{ let v=parseInt(amountEl.value||'1',10); if(v<1000) amountEl.value=v+1; });
  amountEl.addEventListener('change',()=>{ let v=parseInt(amountEl.value,10); if(isNaN(v)||v<1) v=1; if(v>1000) v=1000; amountEl.value=v; });
  // allow holding
  let holdInt=null;
  minusBtn.addEventListener('mousedown',()=>{ holdInt=setInterval(()=>{ let v=parseInt(amountEl.value,10); if(v>1) amountEl.value=v-1; }, 80); });
  plusBtn.addEventListener('mousedown',()=>{ holdInt=setInterval(()=>{ let v=parseInt(amountEl.value,10); if(v<1000) amountEl.value=v+1; }, 80); });
  ['mouseup','mouseleave','touchend'].forEach(ev=>{ minusBtn.addEventListener(ev,()=>clearInterval(holdInt)); plusBtn.addEventListener(ev,()=>clearInterval(holdInt)); });

  function setProgress(d,t){ const p=t?Math.round(d/t*100):0; progressBar.style.width=p+'%'; progressCount.textContent=d+' / '+t; }

  function showSuccess(n,total){
    resultCard.classList.remove('hidden');
    resultCard.style.borderColor = n>0 ? '#bbf7d0' : '#fecaca';
    if(n>0){
      resultContent.innerHTML = `
        <div class="w-10 h-10 rounded-full bg-[#f0fdf4] border border-[#bbf7d0] flex items-center justify-center shrink-0">
          <svg width="18" height="18" viewBox="0 0 18 18" fill="none"><path d="M4 9L7.5 12.5L14 5.5" stroke="#10b981" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </div>
        <div class="flex-1">
          <div class="text-[13px] font-bold text-[#065f46]"><span class="text-[22px] font-extrabold">${n}</span> messages delivered</div>
          <div class="text-[11px] font-medium text-[#047857] mt-0.5">${n===total ? 'All requested were sent successfully.' : n + ' of ' + total + ' delivered.'}</div>
        </div>`;
    } else {
      resultContent.innerHTML = `
        <div class="w-10 h-10 rounded-full bg-[#fef2f2] border border-[#fecaca] flex items-center justify-center shrink-0">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><circle cx="8" cy="8" r="6" stroke="#ef4444" stroke-width="1.4"/><path d="M8 5V8" stroke="#ef4444" stroke-width="1.6" stroke-linecap="round"/></svg>
        </div>
        <div class="flex-1">
          <div class="text-[13px] font-bold text-[#991b1b]">0 delivered</div>
          <div class="text-[11px] font-medium text-[#b91c1c] mt-0.5">Check username or try again — NGL may be limiting.</div>
        </div>`;
    }
    resultCard.scrollIntoView({behavior:'smooth', block:'nearest'});
  }

  form.addEventListener('submit', async (e)=>{
    e.preventDefault();
    const username = usernameEl.value.trim().replace(/^@/,'').replace(/.*ngl\.link\//,'').split('/')[0].split('?')[0].trim();
    const message = messageEl.value.trim();
    let amount = parseInt(amountEl.value,10);
    if(!username){ usernameEl.focus(); usernameEl.classList.add('!border-[#ef4444]'); setTimeout(()=>usernameEl.classList.remove('!border-[#ef4444]'),800); return; }
    if(username.length<2||username.length>30){ alert('Invalid username'); return; }
    if(!message){ messageEl.focus(); return; }
    if(isNaN(amount)||amount<1) amount=1;
    if(amount>1000) amount=1000;

    sendBtn.disabled=true; sendLabel.textContent='Sending…'; sendSpinner.classList.remove('hidden');
    resultCard.classList.add('hidden'); progressWrap.classList.remove('hidden'); setProgress(0,amount); progressText.textContent='Sending…';

    let delivered=0;
    let done=0;
    const CHUNK=20; // max per request
    const DELAY=0; // ultra fast

    // Use high concurrency for speed: send up to 5 chunks in parallel
    // For 1000 messages = 50 chunks, parallel makes it ~10x faster
    const CONCURRENCY=5;

    async function sendChunk(size){
      const res = await fetch('/api/send', {
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ username, message, count: size, delay: DELAY })
      });
      const data = await res.json();
      if(data && data.success){
        return (data.results||[]).filter(r=>r.success).length;
      }
      return 0;
    }

    // Chunk the total into pieces of CHUNK
    const chunks=[];
    for(let off=0; off<amount; off+=CHUNK) chunks.push(Math.min(CHUNK, amount-off));

    // Process in batches of CONCURRENCY in parallel
    for(let i=0;i<chunks.length;i+=CONCURRENCY){
      const batch = chunks.slice(i, i+CONCURRENCY);
      const results = await Promise.all(batch.map(sz=>sendChunk(sz)));
      for(let r of results) delivered+=r;
      done += batch.reduce((a,b)=>a+b,0);
      setProgress(done, amount);
      progressText.textContent = delivered + ' delivered…';
    }

    sendBtn.disabled=false; sendLabel.textContent='Send messages'; sendSpinner.classList.add('hidden'); progressWrap.classList.add('hidden');
    showSuccess(delivered, amount);
  });
</script>
</body>
</html>
